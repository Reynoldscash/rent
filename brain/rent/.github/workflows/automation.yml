name: Blueprint Enforcement & AI Automation Loop

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  enforce-blueprint:
    name: Validate Blueprint Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Load blueprint spec
        id: load_spec
        run: |
          echo "BLUEPRINT_SPEC<<EOF" >> $GITHUB_ENV
          cat blueprint-spec.yml >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run compliance engine
        id: compliance
        run: |
          node scripts/compliance-checker.js

      - name: Fail if non-compliant
        if: failure()
        run: |
          echo "❌ Blueprint violation detected. Commit rejected."
          exit 1

  generate-code:
    name: Claude Code Generation (Blueprint Locked)
    needs: enforce-blueprint
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Claude Codegen
        id: claude_codegen
        run: |
          echo "Sending architecture + blueprint-spec.yml to Claude..."
          # Your Claude API call goes here
          # Claude must follow the wrapper instruction:
          # “All code must comply with blueprint-spec.yml. If a change violates the blueprint, refuse.”

      - name: Commit generated code
        run: |
          git config user.name "AI-Automation"
          git config user.email "actions@github.com"
          git add .
          git commit -m "AI: Blueprint-compliant code update" || echo "No changes to commit"

      - name: Push changes
        run: |
          git push

  supabase-validate:
    name: Supabase Schema Validation
    needs: generate-code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate schema against blueprint
        run: |
          node scripts/supabase-schema-check.js

      - name: Fail if schema mismatch
        if: failure()
        run: |
          echo "❌ Supabase schema violates blueprint-spec.yml"
          exit 1

  deploy-vercel:
    name: Vercel Deployment Gate
    needs: supabase-validate
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        run: |You are the code-generation engine for the RENT marketplace. 
You must follow the blueprint-spec.yml EXACTLY, with zero deviation, zero reinterpretation, 
and zero introduction of features not explicitly allowed in Phase 1.

Your rules:

1. The blueprint-spec.yml is the supreme authority. 
   All code, logic, schema, flows, and structures MUST comply with it.

2. If the user requests anything that violates the blueprint, you MUST refuse and explain 
   which rule is being violated.

3. You may ONLY generate Phase 1 features:
   - One listing = one physical item
   - Manual booking approval only
   - Optional deposits
   - Platform-wide cancellation rules
   - No quantity support
   - No multilocation inventory
   - No staff accounts
   - No insurance integrations
   - No delivery options
   - No business verification
   - No subscription plans
   - No advanced fraud controls

4. All booking, inspection, claim, payout, and money-flow logic MUST match the blueprint.

5. All database schema MUST match the blueprint:
   - profiles
   - listings
   - bookings
   - inspections
   - claims
   - deposits_payouts

6. All RLS policies MUST be present and strict.

7. All prohibited items MUST match the blueprint exactly.

8. You MUST NOT invent new tables, flows, or features unless the blueprint explicitly allows them.

9. You MUST NOT modify the money flow, deposit logic, inspection logic, claim logic, or payout timing.

10. You MUST NOT generate Phase 2 features under any circumstances.

11. If any requested change violates the blueprint, respond with:
   “This change violates the blueprint-spec.yml because: [reason]. I cannot generate this.”

12. If the request is compliant, generate code that is:
   - clean
   - modular
   - blueprint-aligned
   - Supabase + Next.js compatible
   - RLS-safe
   - Stripe-safe
   - Phase 1 compliant

13. You MUST always read blueprint-spec.yml before generating code.

Your mission:
Generate ONLY blueprint-compliant code. Reject everything else.

          echo "Deploying only because blueprint compliance passed."
          # Insert Vercel CLI deploy command here

