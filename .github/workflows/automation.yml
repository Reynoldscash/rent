name: Blueprint Enforcement & AI Automation Loop

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  enforce-blueprint:
    name: Validate Blueprint Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Load blueprint spec
        id: load_spec
        run: |
          echo "BLUEPRINT_SPEC<<EOF" >> $GITHUB_ENV
          cat blueprint-spec.yml >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run compliance engine
        id: compliance
        run: |
          node scripts/compliance-checker.js

      - name: Fail if non-compliant
        if: failure()
        run: |
          echo "❌ Blueprint violation detected. Commit rejected."
          exit 1

  generate-code:
    name: Claude Code Generation (Blueprint Locked)
    needs: enforce-blueprint
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Claude Codegen
        id: claude_codegen
        run: |
          echo "Sending architecture + blueprint-spec.yml to Claude..."
          # Claude API call goes here

      - name: Commit generated code
        run: |
          git config user.name "AI-Automation"
          git config user.email "actions@github.com"
          git add .
          git commit -m "AI: Blueprint-compliant code update" || echo "No changes to commit"

      - name: Push changes
        run: |
          git push

  supabase-validate:
    name: Supabase Schema Validation
    needs: generate-code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate schema against blueprint
        run: |
          node scripts/supabase-schema-check.js

      - name: Fail if schema mismatch
        if: failure()
        run: |
          echo "❌ Supabase schema violates blueprint-spec.yml"
          exit 1

  deploy-vercel:
    name: Vercel Deployment Gate
    needs: supabase-validate
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
      curl https://api.anthropic.com/v1/messages \
  -H "x-api-key: $CLAUDE_API_KEY" \
  -H "content-type: application/json" \
  -d "{
    \"model\": \"claude-3-5-sonnet-20240620\",
    \"max_tokens\": 4096,
    \"temperature\": 0,
    \"system\": \"You are the code-generation engine for the RENT marketplace. You must follow the blueprint-spec.yml EXACTLY, with zero deviation, zero reinterpretation, and zero introduction of features not explicitly allowed in Phase 1. If any requested change violates the blueprint, you MUST refuse and explain which rule is being violated. You may ONLY generate Phase 1 features: one listing = one physical item, manual booking approval, optional deposits, platform-wide cancellation rules, no quantity support, no multilocation inventory, no staff accounts, no insurance, no delivery, no business verification, no subscription plans, no advanced fraud controls. All booking, inspection, claim, payout, and money-flow logic MUST match the blueprint. All database schema MUST match the blueprint. All RLS policies MUST be present and strict. All prohibited items MUST match the blueprint. You MUST NOT invent new tables, flows, or features unless the blueprint explicitly allows them. You MUST NOT modify the money flow, deposit logic, inspection logic, claim logic, or payout timing. You MUST NOT generate Phase 2 features under any circumstances. If any requested change violates the blueprint, respond with: 'This change violates the blueprint-spec.yml because: [reason]. I cannot generate this.' If the request is compliant, generate clean, modular, blueprint-aligned code compatible with Next.js, Supabase, Stripe, and Phase 1 constraints. You MUST always read blueprint-spec.yml before generating code.\",
    \"messages\": [
      {
        \"role\": \"user\",
        \"content\": \"Here is the repository context and blueprint. Generate ONLY blueprint-compliant code. Reject everything else.\\n\\n--- BLUEPRINT SPEC ---\\n$(cat blueprint-spec.yml)\\n\\n--- REPO FILES ---\\n$(ls -R .)\"
      }
    ]
  }"

        run: |
          echo "Deploying only because blueprint compliance passed."
          # Vercel CLI deploy command here
