phase: 1
description: >
  Strict Phase‑1 blueprint for the RENT marketplace. This document defines
  the complete set of allowed features, flows, tables, and rules for Phase‑1.
  No Phase‑2 or Phase‑3 features may be implemented. Claude and all automation
  must reject any request outside this specification.

# ---------------------------------------------------------
# USERS & PROFILES
# ---------------------------------------------------------
profiles:
  fields:
    - id: uuid (PK)
    - email: string
    - full_name: string
    - phone: string
    - supplier_type: enum("individual", "business")
    - business_name: string | null
    - badge: enum("standard", "verified")  # manual admin toggle
    - stripe_connect_id: string | null     # required before accepting bookings
    - created_at: timestamp
  rules:
    - suppliers must be within 30-mile radius of Wichita, KS
    - suppliers cannot accept bookings until Stripe Connect onboarding is complete
    - phone number required for all suppliers

# ---------------------------------------------------------
# LISTINGS
# ---------------------------------------------------------
listings:
  fields:
    - id: uuid (PK)
    - owner_id: uuid (FK → profiles.id)
    - title: string
    - description: string
    - condition: string
    - accessories: string[]  # simple array of accessory names
    - pickup_instructions: text
    - return_instructions: text
    - safety_notes: text
    - price_per_day: numeric
    - deposit_amount: numeric | null  # optional per listing
    - photos: private_storage[]        # stored privately with signed URLs
    - created_at: timestamp
  rules:
    - one listing = one physical item
    - no quantity field
    - no multi-location inventory
    - photos must be private (signed URLs only)

# ---------------------------------------------------------
# BOOKINGS
# ---------------------------------------------------------
bookings:
  fields:
    - id: uuid (PK)
    - listing_id: uuid (FK → listings.id)
    - renter_id: uuid (FK → profiles.id)
    - owner_id: uuid (FK → profiles.id)
    - start_date: date
    - end_date: date
    - status: enum(
        "pending_approval",
        "approved",
        "pickup_confirmed",
        "active",
        "returned",
        "inspection_window",
        "claim_window",
        "completed",
        "cancelled"
      )
    - renter_fee: numeric  # always $5
    - owner_commission_rate: numeric  # always 12%
    - cancellation_fee: numeric | null
    - created_at: timestamp
  rules:
    - manual approval only
    - booking lifecycle must follow:
      pending_approval → approved → pickup_confirmed → active → returned → inspection_window → claim_window → completed
    - cancellation:
      - full refund if cancelled ≥24 hours before pickup
      - otherwise $5 cancellation fee
    - booking cannot be approved unless owner has Stripe Connect onboarding completed

# ---------------------------------------------------------
# INSPECTIONS
# ---------------------------------------------------------
inspections:
  fields:
    - id: uuid (PK)
    - booking_id: uuid (FK → bookings.id)
    - type: enum("before_pickup", "after_return")
    - photos: private_storage[]
    - notes: text
    - accessories_present: string[]
    - fuel_or_battery_level: string
    - created_at: timestamp
  rules:
    - both inspections required for every booking
    - photos must be private (signed URLs)

# ---------------------------------------------------------
# CLAIMS
# ---------------------------------------------------------
claims:
  fields:
    - id: uuid (PK)
    - booking_id: uuid (FK → bookings.id)
    - owner_id: uuid (FK → profiles.id)
    - renter_id: uuid (FK → profiles.id)
    - description: text
    - photos: private_storage[]
    - status: enum("filed", "renter_accepted", "renter_disputed", "approved", "rejected", "closed")
    - created_at: timestamp
  rules:
    - owner files claim
    - renter may accept or dispute
    - platform admin decides disputed claims
    - claim window = 24 hours after return

# ---------------------------------------------------------
# DEPOSITS & PAYMENTS
# ---------------------------------------------------------
deposits_payouts:
  fields:
    - id: uuid (PK)
    - booking_id: uuid (FK → bookings.id)
    - deposit_amount: numeric | null
    - deposit_status: enum("held", "released", "applied")
    - payout_amount: numeric
    - payout_status: enum("pending", "paid")
    - created_at: timestamp
  rules:
    - deposits optional per listing
    - deposits must be charged (not held) and refunded later
    - payout = (booking total - 12% commission)
    - renter fee = $5 per booking
    - payouts only occur after:
      - inspection window closes
      - claim window closes
      - claim resolved (if any)

# ---------------------------------------------------------
# PROHIBITED ITEMS
# ---------------------------------------------------------
prohibited_items:
  rules:
    - must match company blueprint list exactly
    - suppliers listing prohibited items must be suspended

# ---------------------------------------------------------
# SUSPENSIONS & AUDIT LOGS
# ---------------------------------------------------------
suspensions:
  fields:
    - id: uuid (PK)
    - profile_id: uuid (FK → profiles.id)
    - reason: text
    - created_at: timestamp

audit_logs:
  fields:
    - id: uuid (PK)
    - actor_id: uuid (FK → profiles.id | admin)
    - action: string
    - target_id: uuid | null
    - details: jsonb
    - created_at: timestamp

# ---------------------------------------------------------
# STORAGE RULES
# ---------------------------------------------------------
storage:
  rules:
    - all photos (listings, inspections, claims) must be private
    - access only via temporary signed URLs

# ---------------------------------------------------------
# PHASE‑1 EXPLICITLY FORBIDDEN FEATURES
# ---------------------------------------------------------
forbidden:
  - quantity fields
  - multi-location inventory
  - staff accounts
  - delivery options
  - business verification
  - subscription plans
  - advanced fraud controls
  - messaging system
  - categories
  - availability calendars
  - reviews/trust signals
  - admin dashboards beyond minimal claim resolution
  - any new tables not listed above
