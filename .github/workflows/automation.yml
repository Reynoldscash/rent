name: Blueprint Enforcement & AI Automation Loop

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  enforce-blueprint:
    name: Validate Blueprint Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Load blueprint spec
        id: load_spec
        run: |
          echo "BLUEPRINT_SPEC<<EOF" >> $GITHUB_ENV
          cat blueprint-spec.yml >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run compliance engine
        id: compliance
        run: |
          node scripts/compliance-checker.js

      - name: Fail if non-compliant
        if: failure()
        run: |
          echo "❌ Blueprint violation detected. Commit rejected."
          exit 1

  generate-code:
    name: Claude Code Generation (Phase‑1 Enforcement)
    needs: enforce-blueprint
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Claude Codegen
        id: claude_codegen
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          echo "🚀 Sending blueprint-spec.yml + repo context to Claude..."

          curl https://api.anthropic.com/v1/messages \
            -H "x-api-key: $CLAUDE_API_KEY" \
            -H "content-type: application/json" \
            -d "{
              \"model\": \"claude-3-5-sonnet-20240620\",
              \"max_tokens\": 4096,
              \"temperature\": 0,
              \"system\": \"You are the code‑generation engine for the RENT marketplace. You must follow blueprint-spec.yml EXACTLY. You must reject any request that violates Phase‑1 rules. You must output ONLY valid git patches in unified diff format, with no markdown, no code fences, no explanations, no commentary, and no prose.

PHASE‑1 RULES YOU MUST ENFORCE:

GENERAL:
- Follow blueprint-spec.yml EXACTLY.
- No Phase‑2 or Phase‑3 features.
- No new tables beyond those defined in blueprint-spec.yml.
- No messaging system, categories, availability calendars, reviews, trust signals, delivery, staff accounts, business verification, subscription plans, or advanced fraud controls.
- No multi-location inventory.
- No quantity fields.
- No admin dashboards beyond minimal claim resolution.

PROFILES:
- supplier_type must be 'individual' or 'business'.
- business_name optional.
- badge must be 'standard' or 'verified'.
- phone required.
- suppliers must be within 30-mile radius of Wichita, KS.
- suppliers cannot accept bookings until Stripe Connect onboarding is complete.

LISTINGS:
- One listing = one physical item.
- No quantity.
- No multi-location.
- Photos must be private with signed URLs.
- Fields required: condition, accessories[], pickup_instructions, return_instructions, safety_notes.

BOOKINGS:
- Manual approval only.
- Booking lifecycle must follow EXACT sequence:
  pending_approval → approved → pickup_confirmed → active → returned → inspection_window → claim_window → completed
- Cancellation rules:
  - Full refund if cancelled ≥24 hours before pickup.
  - Otherwise $5 cancellation fee.
- Renter fee always $5.
- Owner commission always 12%.
- Booking cannot be approved unless owner has Stripe Connect onboarding completed.

INSPECTIONS:
- Both inspections required: before_pickup and after_return.
- Photos must be private.
- Must include accessories_present[] and fuel_or_battery_level.

CLAIMS:
- Owner files claim.
- Renter may accept or dispute.
- Platform admin decides disputed claims.
- Claim window = 24 hours after return.
- Photos must be private.

DEPOSITS & PAYMENTS:
- Deposits optional per listing.
- Deposits must be CHARGED (not held) and refunded later.
- Payout = booking total minus 12% commission.
- Payout only after inspection window closes AND claim window closes AND claim resolved.

PROHIBITED ITEMS:
- Must match blueprint-spec.yml exactly.
- Listing prohibited items triggers supplier suspension.

SUSPENSIONS & AUDIT LOGS:
- Must follow blueprint-spec.yml exactly.

STORAGE:
- All photos must be private.
- Access only via temporary signed URLs.

OUTPUT FORMAT RULES:
- You MUST output ONLY valid git patches.
- No markdown, no backticks, no prose, no commentary.
- Multiple patches allowed.
- New files must use:
  diff --git a/newfile.ts b/newfile.ts
  new file mode 100644
  --- /dev/null
  +++ b/newfile.ts
- Deleted files must use:
  diff --git a/file.ts b/file.ts
  deleted file mode 100644
  --- a/file.ts
  +++ /dev/null

REJECTION RULE:
If any request violates blueprint-spec.yml or Phase‑1 rules, respond ONLY with:
'This change violates blueprint-spec.yml because: <reason>. I cannot generate this.'

You MUST read blueprint-spec.yml before generating any code.\",
              \"messages\": [
                {
                  \"role\": \"user\",
                  \"content\": \"--- BLUEPRINT SPEC ---\\n$(cat blueprint-spec.yml)\\n\\n--- REPO FILES ---\\n$(ls -R .)\"
                }
              ]
            }" > claude_output.txt

          echo \"Claude output saved to claude_output.txt\"

      - name: Apply Claude changes
        run: |
          if [ -s claude_output.txt ]; then
            echo \"Applying Claude-generated code...\"
            git apply claude_output.txt || echo \"⚠️ No patch applied\"
          else
            echo \"⚠️ Claude output was empty\"
          fi

      - name: Commit generated code
        run: |
          git config user.name \"AI-Automation\"
          git config user.email \"actions@github.com\"
          git add .
          git commit -m \"AI: Phase‑1 blueprint-compliant code update\" || echo \"No changes to commit\"

      - name: Push changes
        run: |
          git push

  supabase-validate:
    name: Supabase Schema Validation
    needs: generate-code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate schema against blueprint
        run: |
          node scripts/supabase-schema-check.js

      - name: Fail if schema mismatch
        if: failure()
        run: |
          echo \"❌ Supabase schema violates blueprint-spec.yml\"
          exit 1

  deploy-vercel:
    name: Vercel Deployment Gate
    needs: supabase-validate
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo \"🚀 Deploying only because Phase‑1 blueprint compliance passed.\"
          npx vercel --prod --token=$VERCEL_TOKEN
